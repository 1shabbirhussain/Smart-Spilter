name: smart_expense_tracker
description: "Smart Split - split expenses with friends, synced across devices"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  get: ^4.6.6
  
  # Database
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  path_provider: ^2.1.2

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1
  google_sign_in: ^7.2.0

  # Notifications
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  
  # UI & Animations
  lottie: ^3.1.2
  fl_chart: ^0.69.0
  glassmorphism: ^3.0.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  
  # Export & Share
  pdf: ^3.11.1
  printing: ^5.13.4
  screenshot: ^3.0.0
  share_plus: ^10.1.2
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  emoji_picker_flutter: ^3.1.0
  flutter_colorpicker: ^1.1.0
  
  # Icons
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation (only for Isar)
  isar_community_generator: ^3.4.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7



flutter:
  uses-material-design: true

  assets:
    - assets/branding/splash_logo.png
  
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/branding/app_icon_background.png"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/app_icon_foreground.png"

flutter_native_splash:
  color: "#141A2E"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#141A2E"
    image: assets/branding/splash_android12.png
    icon_background_color: "#141A2E"
  ios: true
  android: true
  web: false
